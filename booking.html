<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お申し込み ｜ IKIGAIプロジェクト®</title>
<meta name="description" content="IKIGAIプロジェクト®の講座お申し込みページです。">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2f6d85">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧘</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600;700;900&family=Noto+Sans+JP:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --sage: #4d8fa6; --sage-light: #a9d3de; --sage-dark: #2f6d85; --sage-deep: #204b5c;
    --cream: #f7fafc; --warm: #eaf4f7; --gold: #6fae9c; --gold-light: #cdeae0;
    --ink: #263238; --muted: #5f6b72; --line: rgba(47,109,133,0.14); --white: #ffffff;
    --shadow-sm: 0 2px 8px rgba(38,50,56,0.04), 0 8px 24px rgba(38,50,56,0.05);
    --shadow-md: 0 6px 16px rgba(38,50,56,0.06), 0 18px 40px rgba(38,50,56,0.08);
    --shadow-lg: 0 12px 28px rgba(38,50,56,0.08), 0 28px 60px rgba(38,50,56,0.12);
  }
  body {
    font-family: 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif;
    background: var(--cream); color: var(--ink); line-height: 1.9;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, .serif { font-family: 'Noto Serif JP', serif; }
  h1, h2, h3 { font-feature-settings: 'palt' 1; }
  a { color: inherit; }
  ::selection { background: var(--sage-light); color: var(--sage-deep); }
  :focus-visible { outline: 2px solid var(--sage); outline-offset: 3px; border-radius: 4px; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 24px; }

  nav {
    position: sticky; top: 0; width: 100%; z-index: 200;
    background: rgba(247,250,252,0.94); backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(47,109,133,0.12);
  }
  .nav-inner { max-width: 1080px; margin: 0 auto; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
  .logo { font-family: 'Noto Serif JP', serif; font-weight: 700; font-size: 1.05rem; color: var(--sage-dark); display: inline-flex; align-items: center; gap: 8px; text-decoration: none; }
  .logo::before { content: ''; width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, var(--sage-light), var(--sage-dark)); flex: none; }
  .logo span { color: var(--gold); }
  .back-link { font-size: 0.84rem; color: var(--sage-dark); text-decoration: none; font-weight: 700; }

  main { padding: 56px 24px 100px; }

  .breadcrumb { font-size: 0.8rem; color: var(--muted); margin-bottom: 20px; }
  .breadcrumb a { color: var(--sage-dark); text-decoration: none; }

  .booking-card {
    background: var(--white); border-radius: 22px; box-shadow: var(--shadow-lg);
    overflow: hidden; margin-bottom: 30px;
  }
  .booking-image { width: 100%; aspect-ratio: 16/9; overflow: hidden; }
  .booking-image img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .booking-body { padding: 34px 32px; }
  .status-badge {
    display: inline-block; font-size: 0.74rem; font-weight: 700; padding: 5px 14px;
    border-radius: 12px; margin-bottom: 14px; letter-spacing: 0.03em;
  }
  .status-open { background: var(--gold-light); color: var(--sage-deep); }
  .status-few { background: #fde8d0; color: #8a5a1e; }
  .status-closed { background: #eee; color: #888; }
  .time-of-day-badge {
    display: inline-block; font-size: 0.72rem; font-weight: 700; padding: 5px 12px;
    border-radius: 10px; background: var(--warm); color: var(--sage-dark); margin-left: 8px; margin-bottom: 14px;
  }

  .booking-title { font-size: 1.5rem; font-weight: 800; margin-bottom: 12px; }
  .booking-catch {
    font-family: 'Noto Serif JP', serif; font-size: 1.02rem; font-weight: 700;
    color: var(--sage-dark); margin-bottom: 14px;
  }
  .booking-desc { color: var(--muted); font-size: 0.95rem; margin-bottom: 22px; line-height: 1.9; }
  .detail-list { margin-bottom: 22px; }
  .detail-list h3 { font-size: 0.86rem; color: var(--sage-dark); margin-bottom: 8px; }
  .detail-list ul { list-style: none; padding: 0; }
  .detail-list li {
    font-size: 0.88rem; color: var(--ink); padding: 8px 0 8px 22px; position: relative;
    border-top: 1px solid var(--line);
  }
  .detail-list li:first-child { border-top: none; }
  .detail-list li::before { content: '✦'; position: absolute; left: 0; color: var(--gold); font-size: 0.8rem; }

  .detail-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
    background: var(--cream); border-radius: 14px; padding: 22px 24px; margin-bottom: 26px;
  }
  .detail-item dt { font-size: 0.72rem; color: var(--gold); font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 4px; }
  .detail-item dd { font-size: 0.94rem; font-weight: 600; }
  @media (max-width: 520px) { .detail-grid { grid-template-columns: 1fr; } }

  .payment-note {
    background: var(--warm); border-left: 4px solid var(--gold);
    padding: 18px 20px; border-radius: 4px; font-size: 0.86rem; color: var(--ink); margin-bottom: 30px;
  }
  .payment-note strong { color: var(--sage-dark); }

  .form-block h2 { font-size: 1.1rem; margin-bottom: 16px; }
  .form-frame-wrap {
    border-radius: 16px; overflow: hidden; box-shadow: var(--shadow-md); background: var(--white);
    min-height: 600px;
  }
  .form-frame-wrap iframe { width: 100%; height: 900px; border: 0; display: block; }

  .form-placeholder {
    text-align: center; padding: 60px 30px; background: var(--white); border-radius: 16px;
    box-shadow: var(--shadow-sm); color: var(--muted); font-size: 0.92rem;
  }

  .booking-form {
    display: flex; flex-direction: column; gap: 18px;
    background: var(--white); border-radius: 16px; box-shadow: var(--shadow-sm); padding: 28px 26px;
  }
  .form-row { display: flex; flex-direction: column; gap: 6px; }
  .form-row label { font-size: 0.86rem; font-weight: 700; color: var(--sage-dark); }
  .form-row input, .form-row textarea {
    font-family: inherit; font-size: 0.92rem; padding: 12px 14px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--cream); color: var(--ink); resize: vertical;
  }
  .form-row input:focus, .form-row textarea:focus { outline: 2px solid var(--sage-light); border-color: var(--sage-dark); }
  .payment-options { display: flex; gap: 12px; flex-wrap: wrap; }
  .payment-option {
    flex: 1; min-width: 160px; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px;
    cursor: pointer; display: flex; align-items: center; gap: 10px; background: var(--cream); font-size: 0.9rem;
  }
  .payment-option input { margin: 0; }
  .payment-option:has(input:checked) { border-color: var(--sage-dark); background: var(--warm); }
  .payment-reference { margin-top: 4px; }
  .payment-reference img {
    display: block; max-width: 220px; width: 100%; border-radius: 12px;
    box-shadow: var(--shadow-sm); border: 1px solid var(--line);
  }
  .payment-reference p {
    font-size: 0.78rem; color: var(--muted); margin-top: 6px;
  }
  .bank-info {
    margin-top: 12px; padding: 14px 16px; border-radius: 10px;
    background: var(--warm); border-left: 4px solid var(--gold);
    font-size: 0.88rem; line-height: 1.9; color: var(--ink);
  }
  .bank-info-title {
    display: block; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em;
    color: var(--gold); margin-bottom: 4px;
  }
  .bank-info-note { font-size: 0.76rem; color: var(--muted); }
  .video-addon-option {
    display: flex; align-items: flex-start; gap: 10px; border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 16px; cursor: pointer; background: var(--cream); font-size: 0.88rem;
  }
  .video-addon-option:has(input:checked) { border-color: var(--gold); background: var(--gold-light); }
  .video-addon-option input { margin: 3px 0 0; flex: none; }
  .video-addon-option .addon-title { font-weight: 700; color: var(--sage-dark); display: block; margin-bottom: 3px; }
  .video-addon-option .addon-desc { color: var(--muted); font-size: 0.84rem; }
  .order-total {
    display: flex; justify-content: space-between; align-items: baseline; padding: 14px 18px;
    background: var(--warm); border-radius: 10px; font-size: 0.92rem; font-weight: 700; color: var(--sage-dark);
  }
  .order-total span:last-child { font-size: 1.1rem; }
  .submit-btn {
    border: none; cursor: pointer; padding: 15px 32px; border-radius: 28px; font-weight: 700; font-size: 0.95rem;
    background: linear-gradient(135deg, var(--sage-dark), var(--sage-deep)); color: var(--white);
    box-shadow: 0 10px 26px rgba(47,109,133,0.3);
  }
  .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .form-error { color: #b3413a; font-size: 0.86rem; }
  .form-status {
    text-align: center; padding: 60px 30px; background: var(--white); border-radius: 16px; box-shadow: var(--shadow-sm);
  }
  .bank-instructions {
    background: var(--warm); border-left: 4px solid var(--gold); padding: 18px 20px; border-radius: 4px;
    font-size: 0.9rem; white-space: pre-line; text-align: left;
  }

  .btn {
    display: inline-block; padding: 14px 32px; border-radius: 28px; font-weight: 700; font-size: 0.9rem;
    text-decoration: none; background: linear-gradient(135deg, var(--sage-dark), var(--sage-deep)); color: var(--white);
    box-shadow: 0 10px 26px rgba(47,109,133,0.3); margin-top: 14px;
  }

  .not-found { text-align: center; padding: 80px 24px; }
  .not-found h1 { font-size: 1.4rem; margin-bottom: 16px; }

  footer { background: var(--ink); color: rgba(255,255,255,0.55); padding: 40px 24px; text-align: center; font-size: 0.8rem; }
  footer .footer-links { margin-bottom: 12px; }
  footer .footer-links a { color: rgba(255,255,255,0.75); text-decoration: none; margin: 0 10px; }
  footer .footer-links a:hover { text-decoration: underline; }
  .social-icons { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 16px; }
  .social-icons a {
    display: inline-flex; align-items: center; justify-content: center;
    width: 34px; height: 34px; border-radius: 50%; flex: none;
    background: rgba(255,255,255,0.14); color: var(--white); border: 1px solid rgba(255,255,255,0.28);
    transition: background 0.2s ease, transform 0.2s ease;
  }
  .social-icons a:hover { background: rgba(255,255,255,0.24); transform: translateY(-2px); }
  .social-icons a.icon-line { background: none; border: none; }
  .social-icons a.icon-line:hover { background: none; }
  .social-icons a.icon-line svg { border-radius: 22%; }
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a class="logo" href="index.html">IKIGAI<span>プロジェクト®</span></a>
    <a class="back-link" href="index.html#program">← トップページに戻る</a>
  </div>
</nav>

<main>
  <div class="wrap">
    <div class="breadcrumb"><a href="index.html">トップ</a> ／ お申し込み</div>
    <div id="content">読み込み中です…</div>
  </div>
</main>

<footer>
  <div class="social-icons">
    <a href="https://www.instagram.com/ikigaiproject.yoga/" target="_blank" rel="noopener" aria-label="Instagram">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.3" cy="6.7" r="1.1" fill="currentColor" stroke="none"/></svg>

      <svg width="28" height="28" viewBox="0 0 36 36"><rect width="36" height="36" rx="9" fill="#06C755"/><path fill="#fff" d="M18 8.2c-5.7 0-10.4 3.8-10.4 8.4 0 4.1 3.6 7.6 8.6 8.3.9.2 1.6.6 1.8 1.2.2.5.1 1.4.1 2 0 0-.1.5.2.7.3.2.6 0 .6 0 .3-.2 3.8-2.6 5.3-4.3 2.6-2.9 3.9-6 3.9-8.9 0-4.6-4.6-8.4-10.1-8.4z"/></svg>

<script src="data/courses.js"></script>
<script>
  // Apps ScriptをWebアプリとしてデプロイしたときのURLに置き換えてください（SETUP-BOOKING-SYSTEM.md参照）
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx1SdRAjDlsltp89xGe-UeB8OjdueX-7gF4mTCrD_nz5-wpLt5VmgsBrOiMVkKQ0Ssj/exec';
  // 迷惑メール対策：アドレスを直接書かずBase64で保持し、実行時にだけ復元する
  const CONTACT_EMAIL = atob('eW9kYXlvZ2EyNTI1QGdtYWlsLmNvbQ==');

  const params = new URLSearchParams(window.location.search);
  const id = params.get('course');
  const course = COURSES.find(c => c.id === id);
  const content = document.getElementById('content');

  const statusLabel = { open: '募集中', few: '残りわずか', closed: '受付終了' };
  const timeOfDayBadge = { morning: '🌅 朝ヨガ', evening: '🌙 夜ヨガ' };

  function escapeHtml(str) {
    return String(str == null ? '' : str).replace(/[&<>"']/g, s => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[s]));
  }

  function renderDescription(c) {
    const desc = (c.description || '').split('\n').join('<br>');
    const catchLine = c.catch ? `<p class="booking-catch">${c.catch}</p>` : '';
    const itemsBlock = c.items && c.items.length
      ? `<div class="detail-list"><h3>内容</h3><ul>${c.items.map(i => `<li>${i}</li>`).join('')}</ul></div>`
      : '';
    const belongingsBlock = c.belongings && c.belongings.length
      ? `<div class="detail-list"><h3>持ち物</h3><ul>${c.belongings.map(i => `<li>${i}</li>`).join('')}</ul></div>`
      : '';
    return `${catchLine}<p class="booking-desc">${desc}</p>${itemsBlock}${belongingsBlock}`;
  }

  if (!course) {
    content.innerHTML = `
      <div class="not-found">
        <h1>講座が見つかりませんでした</h1>
        <p style="color:var(--muted); margin-bottom:20px;">お手数ですが、トップページから改めて講座をお選びください。</p>
        <a class="btn" href="index.html#program">プログラム一覧へ</a>
      </div>`;
  } else if (course.bookingType === 'external') {
    document.title = course.name + ' お申し込み ｜ IKIGAIプロジェクト®';

    content.innerHTML = `
      <div class="booking-card">
        <div class="booking-image"><img src="${course.image}" alt="${course.name}"></div>
        <div class="booking-body">
          <span class="status-badge status-${course.status}">${statusLabel[course.status] || ''}</span>${course.timeOfDay ? `<span class="time-of-day-badge">${timeOfDayBadge[course.timeOfDay]}</span>` : ''}
          <h1 class="booking-title">${course.name}</h1>
          ${renderDescription(course)}
          <dl class="detail-grid">
            <div class="detail-item"><dt>次回開催日</dt><dd>${course.nextDateText}</dd></div>
            <div class="detail-item"><dt>時間</dt><dd>${course.time}</dd></div>
            <div class="detail-item"><dt>開催頻度</dt><dd>${course.scheduleText}</dd></div>
            <div class="detail-item"><dt>会場</dt><dd>${course.venue}</dd></div>
            <div class="detail-item"><dt>定員</dt><dd>${course.capacity}</dd></div>
            <div class="detail-item"><dt>参加費</dt><dd>${course.price}</dd></div>
          </dl>
        </div>
      </div>
      <div class="form-block">
        <h2>お申し込み方法</h2>
        <div class="form-placeholder" style="text-align:left;">
          ${course.venueIsFixed === false
            ? ''
            : `この講座は <strong style="color:var(--sage-dark);">${course.venue}</strong> が窓口となっています。<br><br>`}
          ${course.facilityNote || '会場に直接お申し込みください。'}<br><br>
          ご不明な点はIKIGAIプロジェクト（<a href="mailto:${CONTACT_EMAIL}" style="color:var(--sage-dark); font-weight:700;">${CONTACT_EMAIL}</a>）までお気軽にご連絡ください。
        </div>
      </div>`;
  } else {
    renderInternalBooking(course);
  }

  function renderInternalBooking(c) {
    document.title = c.name + ' お申し込み ｜ IKIGAIプロジェクト®';

    content.innerHTML = `
      <div class="booking-card">
        <div class="booking-image"><img src="${c.image}" alt="${c.name}"></div>
        <div class="booking-body">
          <span class="status-badge status-${c.status}">${statusLabel[c.status] || ''}</span>${c.timeOfDay ? `<span class="time-of-day-badge">${timeOfDayBadge[c.timeOfDay]}</span>` : ''}
          <h1 class="booking-title">${c.name}</h1>
          ${renderDescription(c)}
          <dl class="detail-grid">
            <div class="detail-item"><dt>次回開催日</dt><dd>${c.nextDateText}</dd></div>
            <div class="detail-item"><dt>時間</dt><dd>${c.time}</dd></div>
            <div class="detail-item"><dt>開催頻度</dt><dd>${c.scheduleText}</dd></div>
            <div class="detail-item"><dt>会場</dt><dd>${c.venue}</dd></div>
            <div class="detail-item"><dt>定員</dt><dd>${c.capacity}</dd></div>
            <div class="detail-item"><dt>参加費</dt><dd>${c.price}</dd></div>
          </dl>
        </div>
      </div>
      <div class="form-block">
        <h2>お申し込みフォーム</h2>
        <form id="booking-form" class="booking-form" novalidate>
          <div class="form-row"><label>お名前 *</label><input type="text" name="name" required></div>
          <div class="form-row"><label>フリガナ</label><input type="text" name="kana"></div>
          <div class="form-row"><label>メールアドレス *</label><input type="email" name="email" required></div>
          <div class="form-row"><label>電話番号</label><input type="tel" name="phone"></div>
          <div class="form-row"><label>参加人数</label><input type="number" name="people" min="1" value="1"></div>
          <div class="form-row"><label>ご要望・ご質問</label><textarea name="message" rows="3"></textarea></div>
          ${c.videoAddonPrice ? `
          <div class="form-row">
            <label class="video-addon-option">
              <input type="checkbox" name="addVideo" id="addVideoCheckbox">
              <span>
                <span class="addon-title">参加者特典：セルフケア動画（+${c.videoAddonPrice.toLocaleString()}円）</span>
                <span class="addon-desc">ご自宅でも続けられるセルフケア動画をご案内します。次回のお申し込みと一緒に追加する方が多い特典です。</span>
              </span>
            </label>
          </div>` : ''}
          <div class="form-row">
            <label>お支払い方法 *</label>
            <div class="payment-options">
              <label class="payment-option"><input type="radio" name="paymentMethod" value="paypay" required> PayPay（オンライン決済）</label>
              <label class="payment-option"><input type="radio" name="paymentMethod" value="bank_transfer" required> 銀行振込</label>
            </div>
            <div class="payment-reference" id="paypayInfo" hidden>
              <img src="images/payment-paypay.png" alt="PayPayのお支払い用QRコード">
              <p>金額を入力してお支払いのうえ、支払い画面のスクリーンショット（写メ）を、<a href="https://lin.ee/61XYyrz" target="_blank" rel="noopener" style="color:var(--sage-dark); font-weight:700;">公式LINE</a>にお名前を添えてお送りください。</p>
            </div>
            <div class="payment-reference" id="bankInfo" hidden>
              <div class="bank-info">
                <span class="bank-info-title">振込先</span>
                ゆうちょ銀行<br>
                記号：16130　番号：19673021<br>
                （普通：六一八店 1967302）<br>
                口座名義：ヨダ レイコ<br>
                <span class="bank-info-note">※恐れ入りますが振込手数料はご負担ください</span>
              </div>
            </div>
          </div>
          <div class="order-total"><span>お支払い合計</span><span id="orderTotal">¥${c.amount.toLocaleString()}</span></div>
          <div class="form-error" id="form-error" style="display:none;"></div>
          <button type="submit" class="submit-btn" id="submit-btn">お申し込みを確定する</button>
        </form>
      </div>`;

    // 選んだお支払い方法に応じて、PayPayのQRか振込先のどちらかだけを表示する
    const paypayInfo = document.getElementById('paypayInfo');
    const bankInfo = document.getElementById('bankInfo');
    document.querySelectorAll('input[name="paymentMethod"]').forEach(function (radio) {
      radio.addEventListener('change', function () {
        paypayInfo.hidden = radio.value !== 'paypay';
        bankInfo.hidden = radio.value !== 'bank_transfer';
      });
    });

    const videoCheckbox = document.getElementById('addVideoCheckbox');
    if (videoCheckbox) {
      videoCheckbox.addEventListener('change', function () {
        const total = c.amount + (videoCheckbox.checked ? c.videoAddonPrice : 0);
        document.getElementById('orderTotal').textContent = '¥' + total.toLocaleString();
      });
    }

    document.getElementById('booking-form').addEventListener('submit', function (ev) {
      ev.preventDefault();
      const form = ev.target;
      const errorBox = document.getElementById('form-error');
      const submitBtn = document.getElementById('submit-btn');
      errorBox.style.display = 'none';

      const paymentMethodInput = form.querySelector('input[name="paymentMethod"]:checked');
      const payload = {
        name: form.name.value.trim(),
        kana: form.kana.value.trim(),
        email: form.email.value.trim(),
        phone: form.phone.value.trim(),
        people: form.people.value,
        message: form.message.value.trim(),
        paymentMethod: paymentMethodInput ? paymentMethodInput.value : '',
        addVideo: !!(form.addVideo && form.addVideo.checked),
        courseId: c.id
      };

      if (!payload.name || !payload.email || !payload.paymentMethod) {
        errorBox.textContent = 'お名前・メールアドレス・お支払い方法は必須です。';
        errorBox.style.display = 'block';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = '送信中…';

      fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      })
        .then(r => r.json())
        .then(res => {
          if (!res.ok) {
            errorBox.textContent = res.error || '送信に失敗しました。時間をおいて再度お試しください。';
            errorBox.style.display = 'block';
            submitBtn.disabled = false;
            submitBtn.textContent = 'お申し込みを確定する';
            return;
          }
          const payBlock = res.method === 'paypay'
            ? `<img src="images/payment-paypay.png" alt="PayPayのお支払い用QRコード" style="display:block; max-width:220px; width:100%; margin:0 auto; border-radius:12px;">`
            : `<div class="bank-instructions">ゆうちょ銀行
記号：16130　番号：19673021
（普通：六一八店 1967302）
口座名義：ヨダ レイコ
※恐れ入りますが振込手数料はご負担ください</div>`;

          content.innerHTML = `
            <div class="form-status">
              <h1 style="font-size:1.3rem; margin-bottom:12px;">お申し込みを受け付けました</h1>
              <p style="color:var(--muted); margin-bottom:18px;">お支払い金額は <strong>${escapeHtml(res.amount)}円</strong> です。</p>
              ${payBlock}
              <p style="color:var(--muted); margin-top:18px;">お支払い後、<a href="https://lin.ee/61XYyrz" target="_blank" rel="noopener" style="color:var(--sage-dark); font-weight:700;">公式LINE</a>にお名前を添えて、お支払い画面のスクリーンショットをお送りください。ご入金の確認をもちまして予約確定となります。</p>
              <p style="color:var(--muted); margin-top:12px; font-size:0.86rem;">同じ内容を確認メールでもお送りしました。</p>
            </div>`;
        })
        .catch(() => {
          errorBox.textContent = '通信エラーが発生しました。時間をおいて再度お試しください。';
          errorBox.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'お申し込みを確定する';
        });
    });
  }

</script>

</body>
</html>
